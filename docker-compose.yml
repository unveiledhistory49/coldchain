services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      COLDCHAIN_DATABASE_URL: sqlite:///./data/coldchain.db
    volumes:
      - coldchain-data:/app/data

volumes:
  coldchain-data:

