[project]
name = "coldchain"
version = "1.0.0"
description = "IoT ingestion platform for temperature-sensitive supply chains: immutable readings, excursion budgets, MKT, and Part-11-style audit trail."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
]
[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "httpx>=0.27"]
[project.scripts]
coldchain = "coldchain.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C90"]
ignore = ["S101", "B008"]
# B008: FastAPI's documented pattern is Query()/Header() as parameter defaults.
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
